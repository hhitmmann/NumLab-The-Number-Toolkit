name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests (nothing to run until a tests/ folder exists)
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=ignore

      - name: Smoke test (5 + 3 must print 8)
        shell: bash
        run: |
          exe=./build/numlab
          [ -f "$exe" ] || exe=./build/Release/numlab.exe
          out=$(printf '1\n5\n+\n+\n3\nn\n0\n' | "$exe")
          echo "$out"
          echo "$out" | grep -F "Answer : 8"
